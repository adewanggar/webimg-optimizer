[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webimg-optimizer"
version = "0.1.0"
description = "Smart Asset & Image Optimizer for Web/Social Media with CLI and Watcher mode"
readme = "README.md"
authors = [{ name = "adewanggar" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0.0",
    "pillow-heif>=0.15.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/adewanggar/webimg-optimizer"
Repository = "https://github.com/adewanggar/webimg-optimizer"
Issues = "https://github.com/adewanggar/webimg-optimizer/issues"

[project.scripts]
webimg = "webimg.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["webimg*"]
