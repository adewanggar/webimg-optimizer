[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webimg"
version = "0.1.0"
description = "Smart Asset & Image Optimizer for Web/Social Media with CLI and Watcher mode"
readme = "README.md"
authors = [{ name = "WebImg Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "pillow-heif>=0.15.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
webimg = "webimg.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["webimg*"]
